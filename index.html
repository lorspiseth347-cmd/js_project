<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <link rel="stylesheet" href="style.css">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="container-fluid mt-2">
      <nav
        class="navbar navbar-expand-lg navbar-light bg-light shadow"
        style="border-radius: 15px"
      >
        <div class="container-fluid">
          <a class="navbar-brand" href="#"
            ><span class="bg-warning px-2 rounded fw-bold py-1">CAR</span>
            <span class="fw-bold">Shop</span></a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav m-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link hover fw-bold active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link hover fw-bold" href="#">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link hover fw-bold" href="#">Service</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link hover fw-bold dropdown-toggle"
                  href="#"
                  id="navbarDropdown"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Vehicle Type
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                  <li><a class="dropdown-item" href="#">Avatar</a></li>
                  <li><a class="dropdown-item" href="#">BMW</a></li>
                  <li><a class="dropdown-item" href="#">Lambogini</a></li>
                </ul>
              </li>
            </ul>
            <form class="d-flex">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <a class="text-dark px-1" href="#">
                <i class="bi bi-person-fill-gear fs-4"></i
              ></a>
              <a class="text-dark px-2" href="#"><i class="bi bi-bag-check-fill fs-4"></i></a>
            </form>
          </div>
        </div>
      </nav>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
